name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Resurrection test (stdlib only, no install)
        run: python tests/golden_check.py
      - name: Full suite without yaml extra
        run: |
          pip install -e . pytest
          python -m pytest tests/ -q
      - name: Full suite with yaml extra
        run: |
          pip install -e '.[yaml]'
          python -m pytest tests/ -q
