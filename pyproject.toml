[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "axm-zombie-adapter"
version = "0.5.0"
description = "Bandwidth aware control plane for pipeline-parallel LLM inference on consumer GPU clusters"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name="Jonathan Sandhu"}]
dependencies = []

[project.optional-dependencies]
yaml = ["pyyaml>=6.0"]

[project.scripts]
axm-zombie = "axm_zombie.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
