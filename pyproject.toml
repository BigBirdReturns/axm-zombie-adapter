[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "axm-zombie-adapter"
version = "0.1.0"
description = "AXM control-plane adapter for zombie compute style multi-GPU inference rigs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6.0",
]

[project.scripts]
axm-zombie = "axm_zombie.cli:main"

[tool.setuptools]
packages = ["axm_zombie", "axm_zombie.exporter", "axm_zombie.runtime"]
